{% macro row(label) -%}
<p><strong>{{ label }}:</strong> {{ caller() }}</p>
{%- endmacro %}

{% macro button(url, label) -%}
<table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0">
<tr>
<td class="button-cell" bgcolor="#000000"><a class="button" href="{{ url }}">{{ label }}</a></td>
</tr>
</table>
{%- endmacro %}

name: Deploy to DigitalOcean via Tailscale # Workflow name displayed in GitHub UI
# Deploys the latest stable tagged container images to production servers.

# Manual trigger with debug ssh option
on:
  workflow_dispatch: # Manual trigger via GitHub UI
    inputs:
      enable_ssh_debugging: # Optional debugging parameter useful to debug the ssh connection to the server
        description: "Enable verbose SSH debugging" # Help text shown in UI
        required: false # Not required to run the workflow
        default: false # Disabled by default
        type: boolean # Simple checkbox in the UI
      deploy_docs_collab:
        description: "Also deploy docs-collab-server. Replaces it only if its image or config changed, dropping live editing sessions. When false it keeps running untouched."
        required: false
        default: false
        type: boolean

permissions:
  contents: read # Minimal permissions required for this workflow

jobs:
  deploy:
    name: Manual Deploy Over Tailscale # Display name for this job
    runs-on: ubuntu-24.04
    environment: production # Use the production environment settings

    steps:
      # Step 1: Setup Tailscale on the GitHub Actions runner
      - name: Set up Tailscale # Connect to the Tailscale network
        uses: tailscale/github-action@v3 # Official Tailscale GitHub Action
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }} # OAuth client ID for Tailscale
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }} # OAuth client secret for Tailscale
          tags: tag:github-actions # Tag to identify this connection in Tailscale
          version: latest # Use the latest version of Tailscale
          use-cache: "true" # Cache Tailscale binary for faster startup

      # Step 1.5: Wait for the Tailscale WireGuard path to the deploy host to be
      # established before running any SSH operations. Without this gate, the
      # deploy step can race Tailscale's MagicDNS / route propagation and
      # `ssh-keyscan` will fail silently under `bash -e`, exiting the step
      # before any echo runs. `tailscale ping` confirms the actual peer path,
      # not just DNS resolution.
      - name: Wait for Tailscale path to deploy host
        run: |
          echo "Waiting for Tailscale to establish path to ${{ secrets.DO_TAILSCALE_NAME }}..."
          for i in {1..20}; do
            if tailscale ping --c 1 --timeout 2s ${{ secrets.DO_TAILSCALE_NAME }} >/dev/null 2>&1; then
              echo "Tailscale path ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Tailscale never reached ${{ secrets.DO_TAILSCALE_NAME }} after 40s"
          tailscale status || true
          exit 1

      # Step 2: (Debug only) Verifies SSH ED25519 SSH key
      - name: Debug ED25519 Key # SSH key debugging step
        if: ${{ inputs.enable_ssh_debugging == true }} # Only run when debugging is enabled
        run: |
          mkdir -p ~/.ssh
          # Create SSH directory if it doesn't exist
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Create private SSH key file
          chmod 600 ~/.ssh/id_ed25519
          # Set secure permissions on the key
          echo "${{ secrets.DO_HOST_KEY }}" >> ~/.ssh/known_hosts
          # Add host key to known hosts
          ssh-keygen -l -f ~/.ssh/id_ed25519
          # Show fingerprint of the key
          ssh-keygen -y -f ~/.ssh/id_ed25519
          # Show public key derived from private key
          ssh -vvv -o StrictHostKeyChecking=accept-new -o BatchMode=yes -i ~/.ssh/id_ed25519 ${{ secrets.DO_USERNAME }}@${{ secrets.DO_TAILSCALE_NAME }} 'echo "Connection successful"'
          # Test connection with verbose output

      # Step 3: Create .env File Locally
      - name: Create .env File on Server # Create environment file for deployment
        run: |
          cat > envfile <<EOF
          # Start heredoc to create env file
          # -------- PostgreSQL Config
          # Database username
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          # Database password
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          # Database name
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          # Container hostname for database
          POSTGRES_HOST=${{ vars.POSTGRES_HOST }}
          # Database port
          POSTGRES_PORT=${{ vars.POSTGRES_PORT }}
          # Database schema
          POSTGRES_SCHEMA=${{ vars.POSTGRES_SCHEMA }}
          POSTGRES_SSL_ROOT_CERT=${{ secrets.POSTGRES_SSL_ROOT_CERT }}
          # Database connection options, hardcoded intentionally
          POSTGRES_OPTIONS=sslmode=verify-full&sslrootcert=/app/root.crt
          # Database connection string
          DATABASE_URL=postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ vars.POSTGRES_HOST }}:${{ vars.POSTGRES_PORT }}/${{ vars.POSTGRES_DB }}?${{ vars.POSTGRES_OPTIONS }}

          # -------- docs-collab dedicated database
          # Full connection string for the collab server's own database on the
          # shared managed cluster (NOT the app database). MUST include
          # ?sslmode=verify-full&sslrootcert=/app/root.crt in the value.
          # The CA cert path is shared with the app (POSTGRES_SSL_ROOT_CERT).
          DOCS_COLLAB_DATABASE_URL=${{ secrets.DOCS_COLLAB_DATABASE_URL }}
          # Collab server sqlx pool sizing. Shares the same per-cluster
          # connection ceiling as the app pool below, so budget them together.
          # Compose falls back to 4 / 1 when these are unset or empty.
          DOCS_COLLAB_DB_MAX_CONNECTIONS=${{ vars.DOCS_COLLAB_DB_MAX_CONNECTIONS }}
          DOCS_COLLAB_DB_MIN_CONNECTIONS=${{ vars.DOCS_COLLAB_DB_MIN_CONNECTIONS }}

          # -------- Database Pool Config
          # Pool sizing must stay below the managed Postgres max connections
          # ceiling (22 on the 1 GB DO tier) to leave headroom for migrator,
          # doadmin, and platform agents. Clap defaults in service/src/config.rs
          # apply if any of these are left unset in the GitHub environment.
          # DB_MAX_CONNECTIONS is the app's total, split between the main pool and the session store pool.
          DB_MAX_CONNECTIONS=${{ vars.DB_MAX_CONNECTIONS }}
          DB_MIN_CONNECTIONS=${{ vars.DB_MIN_CONNECTIONS }}
          DB_CONNECT_TIMEOUT_SECS=${{ vars.DB_CONNECT_TIMEOUT_SECS }}
          DB_ACQUIRE_TIMEOUT_SECS=${{ vars.DB_ACQUIRE_TIMEOUT_SECS }}
          DB_IDLE_TIMEOUT_SECS=${{ vars.DB_IDLE_TIMEOUT_SECS }}
          DB_MAX_LIFETIME_SECS=${{ vars.DB_MAX_LIFETIME_SECS }}

          # -------- Backend Config
          # Docker image for backend
          BACKEND_IMAGE_NAME=${{ vars.BACKEND_IMAGE_NAME }}
          # Docker image for docs-collab-server
          DOCS_COLLAB_IMAGE_NAME=${{ vars.DOCS_COLLAB_IMAGE_NAME }}
          # Container name for backend
          BACKEND_CONTAINER_NAME=${{ vars.BACKEND_CONTAINER_NAME }}
          # We are not building locally so setting to empty string to quiet warning
          BACKEND_BUILD_CONTEXT=""
          # Backend daemon port used by the Rust backend to listen to connection on
          BACKEND_PORT=${{ vars.BACKEND_PORT }}
          # Network interface for backend to listen for incoming connections on
          BACKEND_INTERFACE=${{ vars.BACKEND_INTERFACE }}
          # CORS allowed origins
          BACKEND_ALLOWED_ORIGINS=${{ vars.BACKEND_ALLOWED_ORIGINS }}
          # Logging filter level to apply
          BACKEND_LOG_FILTER_LEVEL=${{ vars.BACKEND_LOG_FILTER_LEVEL }}
          # Protocol for backend (http, https)
          BACKEND_SERVICE_PROTOCOL=${{ vars.BACKEND_SERVICE_PROTOCOL }}
          # Hostname or IP address to reach the backend on
          BACKEND_SERVICE_HOST=${{ vars.BACKEND_SERVICE_HOST }}
          # Backend service port used by the frontend / reverse proxy
          BACKEND_SERVICE_PORT=${{ vars.BACKEND_SERVICE_PORT }}
          # The URL path to proxy the backend API on (e.g. "api" would resolve to https://backend/api/)
          BACKEND_SERVICE_API_PATH=${{ vars.BACKEND_SERVICE_API_PATH }}
          # API version to use between frontend and backend
          BACKEND_API_VERSION=${{ vars.BACKEND_API_VERSION }}
          # Session expiry duration in seconds (default: 24 hours = 86400 seconds)
          BACKEND_SESSION_EXPIRY_SECONDS=${{ vars.BACKEND_SESSION_EXPIRY_SECONDS }}
          # Deployment environment used (development, staging, production)
          RUST_ENV=${{ vars.RUST_ENV }}

          # -------- TipTap Config
          # TipTap account unique ID
          TIPTAP_APP_ID=${{ vars.TIPTAP_APP_ID }}
          # TipTap collaborative editor URL
          TIPTAP_URL=${{ vars.TIPTAP_URL }}
          # TipTap authentication key
          TIPTAP_AUTH_KEY=${{ secrets.TIPTAP_AUTH_KEY }}
          # JWT signing key for TipTap
          TIPTAP_JWT_SIGNING_KEY=${{ secrets.TIPTAP_JWT_SIGNING_KEY }}

          # -------- Resend Config
          # Template ID for welcome emails
          WELCOME_EMAIL_TEMPLATE_ID=${{ vars.WELCOME_EMAIL_TEMPLATE_ID }}
          # Template ID for session-scheduled notification emails
          SESSION_SCHEDULED_EMAIL_TEMPLATE_ID=${{ vars.SESSION_SCHEDULED_EMAIL_TEMPLATE_ID }}
          RECURRING_SESSIONS_SCHEDULED_EMAIL_TEMPLATE_ID=${{ vars.RECURRING_SESSIONS_SCHEDULED_EMAIL_TEMPLATE_ID }}
          # Template ID for action-assigned notification emails
          ACTION_ASSIGNED_EMAIL_TEMPLATE_ID=${{ vars.ACTION_ASSIGNED_EMAIL_TEMPLATE_ID }}
          # Template ID for added-to-organization notification emails
          ADDED_TO_ORGANIZATION_EMAIL_TEMPLATE_ID=${{ vars.ADDED_TO_ORGANIZATION_EMAIL_TEMPLATE_ID }}
          SESSION_RESCHEDULED_EMAIL_TEMPLATE_ID=${{ vars.SESSION_RESCHEDULED_EMAIL_TEMPLATE_ID }}
          RECURRING_SESSIONS_RESCHEDULED_EMAIL_TEMPLATE_ID=${{ vars.RECURRING_SESSIONS_RESCHEDULED_EMAIL_TEMPLATE_ID }}
          SESSION_CANCELLED_EMAIL_TEMPLATE_ID=${{ vars.SESSION_CANCELLED_EMAIL_TEMPLATE_ID }}
          RECURRING_SESSIONS_CANCELLED_EMAIL_TEMPLATE_ID=${{ vars.RECURRING_SESSIONS_CANCELLED_EMAIL_TEMPLATE_ID }}
          # Template ID for the 24-hour upcoming-session reminder. Unset disables the job.
          SESSION_REMINDER_EMAIL_TEMPLATE_ID=${{ vars.SESSION_REMINDER_EMAIL_TEMPLATE_ID }}
          # Reminder lead time and sweep cadence; blank falls back to the in-code defaults (24h / 15min)
          SESSION_REMINDER_LEAD_HOURS=${{ vars.SESSION_REMINDER_LEAD_HOURS }}
          SESSION_REMINDER_POLL_MINUTES=${{ vars.SESSION_REMINDER_POLL_MINUTES }}
          # Reschedule email settle period and cap; blank falls back to the in-code defaults (60s / 300s)
          SESSION_RESCHEDULE_SETTLE_SECONDS=${{ vars.SESSION_RESCHEDULE_SETTLE_SECONDS }}
          SESSION_RESCHEDULE_SETTLE_MAX_SECONDS=${{ vars.SESSION_RESCHEDULE_SETTLE_MAX_SECONDS }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          # Base URL of the frontend app, used to construct links in emails
          FRONTEND_BASE_URL=${{ vars.FRONTEND_BASE_URL }}
          # Public URL of the docs-collab-server, used by the frontend collaborative editor
          DOCS_COLLAB_URL=${{ vars.DOCS_COLLAB_URL }}

          # -------- Frontend Config
          # Docker image for frontend
          FRONTEND_IMAGE_NAME=${{ vars.FRONTEND_IMAGE_NAME }}
          # Container name for frontend
          FRONTEND_CONTAINER_NAME=${{ vars.FRONTEND_CONTAINER_NAME }}
          # We are not building locally so setting to empty string to quiet warning
          FRONTEND_BUILD_CONTEXT=""
          # Frontend service interface to listen for client connections on
          FRONTEND_SERVICE_INTERFACE=${{ vars.FRONTEND_SERVICE_INTERFACE }}
          # Frontend service port
          FRONTEND_SERVICE_PORT=${{ vars.FRONTEND_SERVICE_PORT }}

          # -------- Google OAuth / AI Meeting Integration Config
          # 32-byte AES encryption key for encrypting sensitive API keys in database (hex-encoded)
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          # Google OAuth client ID
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          # Google OAuth client secret
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Google OAuth redirect URI (callback from Google to backend)
          GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
          # URL to redirect to after successful Google OAuth (frontend settings page)
          OAUTH_SUCCESS_REDIRECT_URI=${{ vars.OAUTH_SUCCESS_REDIRECT_URI }}
          # Google OAuth authorization URL
          GOOGLE_OAUTH_AUTH_URL=${{ vars.GOOGLE_OAUTH_AUTH_URL }}
          # Google OAuth token URL
          GOOGLE_OAUTH_TOKEN_URL=${{ vars.GOOGLE_OAUTH_TOKEN_URL }}
          # Google user info URL
          GOOGLE_USERINFO_URL=${{ vars.GOOGLE_USERINFO_URL }}
          # Google Meet API base URL
          GOOGLE_MEET_API_URL=${{ vars.GOOGLE_MEET_API_URL }}

          # -------- Recall.ai Meeting Recording Config
          # Recall.ai system API key (bot creation + async transcription)
          RECALL_AI_API_KEY=${{ secrets.RECALL_AI_API_KEY }}
          # Recall.ai region subdomain (e.g. us-east-1, eu-west-1)
          RECALL_AI_REGION=${{ vars.RECALL_AI_REGION }}
          # Recall.ai webhook signing secret (Svix whsec_... format)
          RECALL_AI_WEBHOOK_SECRET=${{ secrets.RECALL_AI_WEBHOOK_SECRET }}

          # -------- Suggested Actions (AssemblyAI LLM Gateway) Config
          # AssemblyAI API key; an empty value leaves transcript suggestions off
          ASSEMBLY_AI_API_KEY=${{ secrets.ASSEMBLY_AI_API_KEY }}
          # LLM Gateway model (blank uses the in-code default, claude-sonnet-4-6)
          ASSEMBLY_AI_LLM_MODEL=${{ vars.ASSEMBLY_AI_LLM_MODEL }}
          # LLM Gateway base URL (blank uses https://llm-gateway.assemblyai.com/v1)
          ASSEMBLY_AI_LLM_BASE_URL=${{ vars.ASSEMBLY_AI_LLM_BASE_URL }}

          # -------- Coaching Note Image Storage Config
          # Hardcoded intentionally: an empty value is stripped before parsing and
          # would fall back to the "local" default, silently writing note images
          # into the container filesystem where a redeploy destroys them.
          OBJECT_STORE_BACKEND=spaces
          # DigitalOcean Spaces regional endpoint, must match SPACES_REGION
          SPACES_ENDPOINT=${{ vars.SPACES_ENDPOINT }}
          # DigitalOcean Spaces region (e.g. nyc3)
          SPACES_REGION=${{ vars.SPACES_REGION }}
          # DigitalOcean Spaces bucket (Space) name
          SPACES_BUCKET=${{ vars.SPACES_BUCKET }}
          # Spaces access key pair; missing credentials disable image endpoints (503)
          SPACES_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # Upload cap, presigned GET lifetime, and the removal grace period the purge
          # job sweeps on; blank falls back to the in-code defaults
          # (10 MB / 900s / 168h / 60min)
          COACHING_SESSION_IMAGE_MAX_BYTES=${{ vars.COACHING_SESSION_IMAGE_MAX_BYTES }}
          COACHING_SESSION_IMAGE_PRESIGN_TTL_SECONDS=${{ vars.COACHING_SESSION_IMAGE_PRESIGN_TTL_SECONDS }}
          COACHING_SESSION_IMAGE_GRACE_PERIOD_HOURS=${{ vars.COACHING_SESSION_IMAGE_GRACE_PERIOD_HOURS }}
          COACHING_SESSION_IMAGE_PURGE_POLL_MINUTES=${{ vars.COACHING_SESSION_IMAGE_PURGE_POLL_MINUTES }}

          # -------- Nginx Reverse Proxy Config
          SSL_DHPARAMS_PATH=${{ vars.SSL_DHPARAMS_PATH }}

          # -------- Platform Config
          # Target platform for Docker containers
          PLATFORM=${{ vars.PLATFORM }}

          EOF

      # Step 4: SSH and deploy to the digitalocean droplet over private Tailscale tailnet
      - name: Deploy Over SSH and Replace Changed Containers # Main deployment step
        run: |
          mkdir -p ~/.ssh
          # Create SSH directory
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          # Save SSH private key
          chmod 600 ~/.ssh/id_ed25519
          # Set secure permissions on key
          echo "${{ secrets.DO_HOST_KEY }}" >> ~/.ssh/known_hosts
          # Add static host key
          # Refresh dynamic host key with retry. Even after the Tailscale gate
          # passes, ssh-keyscan can hit transient blips (relay reroute, brief
          # packet loss, sshd taking an extra beat). Failure here is non-fatal
          # because DO_HOST_KEY (above) is the authoritative static fallback.
          echo "Refreshing host key for ${{ secrets.DO_TAILSCALE_NAME }}..."
          for i in {1..5}; do
            if ssh-keyscan -T 5 -H ${{ secrets.DO_TAILSCALE_NAME }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "ssh-keyscan succeeded (attempt $i)"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "WARNING: ssh-keyscan failed 5x, falling back to static DO_HOST_KEY only"
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 3s..."
            sleep 3
          done

          # Test SSH connection first
          echo "Testing SSH connection to ${{ secrets.DO_TAILSCALE_NAME }}..."
          if ! ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 ${{ secrets.DO_USERNAME }}@${{ secrets.DO_TAILSCALE_NAME }} 'echo "SSH connection successful"'; then
            echo "ERROR: SSH connection failed to ${{ secrets.DO_TAILSCALE_NAME }}"
            echo "Checking SSH configuration..."
            ssh -vvv -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 ${{ secrets.DO_USERNAME }}@${{ secrets.DO_TAILSCALE_NAME }} 'echo "test"' || true
            exit 1
          fi

          # Copy .env to server
          echo "Copying .env file to server..."
          if ! scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 envfile ${{ secrets.DO_USERNAME }}@${{ secrets.DO_TAILSCALE_NAME }}:/home/deploy/.env; then
            echo "ERROR: Failed to copy .env file"
            exit 1
          fi
          # Upload env file

          # SSH and deploy
          echo "Starting main deployment script..."
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 ${{ secrets.DO_USERNAME }}@${{ secrets.DO_TAILSCALE_NAME }} 'bash -s' << 'DEPLOY_SCRIPT_EOF'
            set -euo pipefail

            # Verify SSH execution is working correctly
            if [[ "$(hostname)" == *"runner"* ]] || [[ "$(pwd)" == *"runner"* ]]; then
                echo "FATAL ERROR: Script is running on GitHub Actions runner instead of target server!"
                exit 1
            fi

            cd /home/deploy

            # Values come from the workflow, never from sourcing .env: its
            # POSTGRES_OPTIONS contains '&', which a shell would run as a command.
            REF='${{ github.ref_name }}'
            RAW="https://raw.githubusercontent.com/refactor-group/refactor-platform-rs/refs/heads/$REF"
            DEPLOY_DOCS_COLLAB='${{ inputs.deploy_docs_collab }}'
            SITE_HOST=$(echo '${{ vars.FRONTEND_BASE_URL }}' | sed -E 's#^https?://##; s#/.*$##')
            ROLLBACK_DIR=/home/deploy/rollback

            # Compose service (also its container name) -> image tag it runs.
            declare -A IMAGE=(
              [rust-app]='${{ vars.BACKEND_IMAGE_NAME }}'
              [nextjs-app]='${{ vars.FRONTEND_IMAGE_NAME }}'
            )
            SERVICES=(rust-app nextjs-app)
            if [ "$DEPLOY_DOCS_COLLAB" = "true" ]; then
              IMAGE[docs-collab]='${{ vars.DOCS_COLLAB_IMAGE_NAME }}'
              SERVICES+=(docs-collab)
            else
              echo "INFO: deploy_docs_collab=false; leaving the running collab server untouched."
            fi

            [ -n "$SITE_HOST" ] || { echo "ERROR: FRONTEND_BASE_URL is empty"; exit 1; }
            for svc in "${SERVICES[@]}"; do
              [ -n "${IMAGE[$svc]}" ] || { echo "ERROR: no image name for $svc"; exit 1; }
              # A digest reference cannot be retagged, which rollback relies on.
              [[ "${IMAGE[$svc]}" != *@* ]] || { echo "ERROR: ${IMAGE[$svc]} must be a tag, not a digest"; exit 1; }
            done

            echo "INFO: 📦 Deploying from branch $REF"
            docker compose version
            df -h /var/lib/docker || true

            declare -A OLD NEW
            CHANGED=()
            BACKEND_STOPPED=false
            MIGRATED=false
            SWITCHED=false

            changed() { [[ " ${CHANGED[*]} " == *" $1 "* ]]; }

            # Point every pulled tag back at the image its container runs, so a
            # reboot (systemd runs `compose up -d` with no pull) keeps the old stack.
            restore_tags() {
              for svc in "${SERVICES[@]}"; do
                if [ -n "${OLD[$svc]:-}" ]; then
                  docker tag "${OLD[$svc]}" "${IMAGE[$svc]}" || echo "WARNING: could not retag ${IMAGE[$svc]}"
                fi
              done
            }

            on_exit() {
              local status=$?
              if [ $status -ne 0 ] && ! $SWITCHED; then
                if $MIGRATED; then
                  echo "ERROR: migrations ran but the new containers were not started; rerun the deploy."
                else
                  echo "ERROR: deploy failed before any container was replaced; restoring the running images."
                  restore_tags
                  if $BACKEND_STOPPED; then
                    docker start rust-app || echo "ERROR: could not restart rust-app"
                    print_images rust-app
                    # A restarted container can come back on a new IP.
                    reload_nginx || echo "ERROR: nginx reload failed"
                  fi
                fi
              fi
            }
            trap on_exit EXIT

            # Print what each container runs: its tag, the git commit it was built
            # from (the image's org.opencontainers.image.revision label), image ID,
            # and registry digest.
            print_images() {
              local name tag image_id revision digest
              for name in "$@"; do
                read -r tag image_id < <(docker inspect -f '{{.Config.Image}} {{.Image}}' "$name" 2>/dev/null) \
                  || { echo "INFO: $name is not running"; continue; }
                revision=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$name" 2>/dev/null || true)
                [ -n "$revision" ] && [ "$revision" != "<no value>" ] || revision=unknown
                digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$image_id" 2>/dev/null || true)
                echo "INFO: $name runs $tag commit=$revision image=$image_id digest=${digest#*@}"
              done
            }

            fetch() {
              for attempt in 1 2 3; do
                if curl -fsSL --retry 2 "$RAW/$1" -o "$2" && [ -s "$2" ]; then
                  return 0
                fi
                echo "INFO: download of $1 failed (attempt $attempt), retrying..."
                sleep $((attempt * 2))
              done
              echo "ERROR: failed to download $1"
              return 1
            }

            reload_nginx() {
              for attempt in $(seq 1 10); do
                if docker exec nginx-reverse-proxy nginx -t >/dev/null 2>&1 \
                  && docker exec nginx-reverse-proxy nginx -s reload; then
                  echo "INFO: nginx reloaded"
                  return 0
                fi
                sleep 2
              done
              docker exec nginx-reverse-proxy nginx -t || true
              return 1
            }

            check_url() {
              curl -fsS -o /dev/null --max-time 5 --resolve "$SITE_HOST:443:127.0.0.1" "https://$SITE_HOST$1"
            }

            collab_healthy() {
              [ "$(docker inspect -f '{{.State.Health.Status}}' docs-collab 2>/dev/null)" = "healthy" ]
            }

            wait_for() {
              for _ in $(seq 1 45); do
                if "$@" >/dev/null 2>&1; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            healthy() {
              wait_for check_url /api/health || { echo "ERROR: backend is not healthy"; return 1; }
              wait_for check_url / || { echo "ERROR: frontend is not healthy"; return 1; }
              if [ "$DEPLOY_DOCS_COLLAB" = "true" ]; then
                wait_for collab_healthy || { echo "ERROR: docs-collab is not healthy"; return 1; }
              fi
              echo "INFO: ✅ backend, frontend$([ "$DEPLOY_DOCS_COLLAB" = "true" ] && echo ", docs-collab") healthy"
            }

            # Exits 0 only when the given backend image knows every applied migration.
            migrations_known_by() {
              docker tag "$1" refactor-rollback/gate:candidate
              local status=0
              BACKEND_IMAGE_NAME=refactor-rollback/gate:candidate \
                docker compose run --rm --no-deps -T --name "migration-gate-$$" migrator migrationctl status || status=$?
              docker rmi refactor-rollback/gate:candidate >/dev/null || true
              return $status
            }

            echo "INFO: 📥 Downloading compose and nginx files..."
            STAGING=/home/deploy/.deploy-staging
            rm -rf "$STAGING"
            mkdir -p "$STAGING/nginx/conf.d" "$STAGING/nginx/scripts"
            fetch docker-compose.yaml "$STAGING/docker-compose.yaml"
            fetch nginx/nginx.conf "$STAGING/nginx/nginx.conf"
            fetch nginx/conf.d/refactor-platform.conf "$STAGING/nginx/conf.d/refactor-platform.conf"
            fetch nginx/scripts/renew-certs.sh "$STAGING/nginx/scripts/renew-certs.sh"
            fetch nginx/scripts/rotate-logs.sh "$STAGING/nginx/scripts/rotate-logs.sh"

            echo "INFO: 📥 Logging into GHCR..."
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            for svc in "${SERVICES[@]}"; do
              OLD[$svc]=$(docker inspect -f '{{.Image}}' "$svc" 2>/dev/null || true)
            done

            echo "INFO: 📥 Pulling images while the current containers keep running..."
            for svc in "${SERVICES[@]}"; do
              docker pull "${IMAGE[$svc]}"
              NEW[$svc]=$(docker image inspect -f '{{.Id}}' "${IMAGE[$svc]}")
              if [ "${OLD[$svc]}" != "${NEW[$svc]}" ]; then
                CHANGED+=("$svc")
              fi
            done
            echo "INFO: Changed images: ${CHANGED[*]:-none}"

            echo "INFO: 🔧 Installing compose and nginx files..."
            mkdir -p nginx/conf.d nginx/logs nginx/scripts nginx/html/.well-known/acme-challenge
            chown -R "$(whoami):$(whoami)" nginx/ 2>/dev/null || true
            # cp writes into the existing files, keeping the inode nginx's single-file
            # bind mount points at; mv would leave nginx reading the old file.
            cp "$STAGING/docker-compose.yaml" docker-compose.yaml
            cp "$STAGING/nginx/nginx.conf" nginx/nginx.conf
            cp "$STAGING/nginx/conf.d/refactor-platform.conf" nginx/conf.d/refactor-platform.conf
            cp "$STAGING/nginx/scripts/renew-certs.sh" nginx/scripts/renew-certs.sh
            cp "$STAGING/nginx/scripts/rotate-logs.sh" nginx/scripts/rotate-logs.sh
            rm -rf "$STAGING"
            chmod 640 docker-compose.yaml
            find nginx -type d -exec chmod 755 {} \;
            find nginx -type f -exec chmod 644 {} \; 2>/dev/null || true
            chmod 755 nginx/scripts/renew-certs.sh nginx/scripts/rotate-logs.sh
            if [ -f .env ]; then
              chmod --reference=docker-compose.yaml .env
              chown --reference=docker-compose.yaml .env
            fi

            echo "INFO: 🔍 Validating config..."
            docker compose config --quiet

            if changed rust-app; then
              # The old backend must not run against the new schema, so it stops
              # before migrations and stays down until the new one starts.
              if [ -n "${OLD[rust-app]}" ]; then
                echo "INFO: 🛑 Stopping the backend for migrations..."
                docker stop rust-app
                BACKEND_STOPPED=true
              fi
              echo "INFO: 🗄️ Running migrations (all or nothing)..."
              docker compose up -d --no-deps --force-recreate migrator
              MIGRATOR_EXIT=$(docker wait db-migrator)
              echo "=== DB Migration Logs ==="
              docker logs db-migrator 2>&1 || true
              echo "========================="
              if [ "$MIGRATOR_EXIT" != "0" ]; then
                echo "ERROR: migrations failed (exit $MIGRATOR_EXIT); none were applied."
                exit 1
              fi
              MIGRATED=true
              print_images db-migrator
            fi

            echo "INFO: 🚀 Replacing changed containers..."
            # Past this point the trap no longer restores tags: containers may already be new.
            SWITCHED=true
            # --no-deps keeps compose from running the migrator again.
            docker compose up -d --no-deps --remove-orphans "${SERVICES[@]}" nginx
            print_images "${SERVICES[@]}"

            # Static nginx upstreams resolve container IPs only at config load.
            reload_nginx || { echo "ERROR: nginx config is invalid; the old config is still serving"; exit 1; }

            echo "INFO: 🩺 Checking health..."
            if ! healthy; then
              ROLLBACK_SERVICES=()
              for svc in "${CHANGED[@]}"; do
                [ -n "${OLD[$svc]}" ] && ROLLBACK_SERVICES+=("$svc")
              done
              if [ ${#ROLLBACK_SERVICES[@]} -eq 0 ]; then
                echo "ERROR: unhealthy and nothing to roll back to."
              elif changed rust-app && [ -n "${OLD[rust-app]}" ] && ! migrations_known_by "${OLD[rust-app]}"; then
                echo "ERROR: unhealthy, and the previous backend does not know the applied migrations; not rolling back automatically."
              else
                echo "WARNING: ⏪ unhealthy; rolling back ${ROLLBACK_SERVICES[*]}..."
                for svc in "${ROLLBACK_SERVICES[@]}"; do
                  docker tag "${OLD[$svc]}" "${IMAGE[$svc]}"
                done
                docker compose up -d --no-deps "${ROLLBACK_SERVICES[@]}"
                print_images "${ROLLBACK_SERVICES[@]}"
                reload_nginx || true
                healthy || echo "ERROR: still unhealthy after rolling back."
              fi
              exit 1
            fi

            # Record what this deploy replaced, so rollback_do.yml can restore it.
            # A deploy that changed no image keeps the existing rollback set.
            if [ ${#CHANGED[@]} -gt 0 ]; then
              mkdir -p "$ROLLBACK_DIR"
              docker images --filter 'reference=refactor-rollback/*:previous' --format '{{.Repository}}:{{.Tag}}' \
                | xargs -r docker rmi >/dev/null 2>&1 || true
              {
                echo "# deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) ref=$REF"
                echo "# service image previous_id previous_digest"
                for svc in "${CHANGED[@]}"; do
                  if [ -n "${OLD[$svc]}" ]; then
                    docker tag "${OLD[$svc]}" "refactor-rollback/$svc:previous"
                    digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "${OLD[$svc]}" 2>/dev/null || true)
                    echo "$svc ${IMAGE[$svc]} ${OLD[$svc]} ${digest:--}"
                  fi
                done
              } > "$ROLLBACK_DIR/manifest"
              echo "INFO: Rollback set:"
              cat "$ROLLBACK_DIR/manifest"
            fi

            echo "INFO: 🧹 Removing dangling images..."
            docker image prune -f

            docker ps -a
            echo "INFO: 🎉 Deployment complete."
          DEPLOY_SCRIPT_EOF

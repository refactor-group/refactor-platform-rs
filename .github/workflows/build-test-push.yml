name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit lands.
# Main is exempt: a deploy mid-merge shouldn't be killed by the next PR merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are never reused in CI; skipping them keeps the
  # cached target dir small.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  REGISTRY: ghcr.io
  # Per-branch image path; docs-collab lives under it at /docs-collab.
  BRANCH_IMAGE: ghcr.io/${{ github.repository }}/${{ github.head_ref || github.ref_name }}
  # Docker layer cache, one tag per image.
  BUILD_CACHE: ghcr.io/${{ github.repository }}/buildcache

jobs:
  # === LINT JOB (Fast Feedback) ===
  # BATS suite for the dispatch resolver runs as the first step of lint so
  # a regex regression fails before clippy/test/docker eat their full
  # runtime. Keeps the Actions sidebar uncluttered (no separate "bats" job).
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run dispatch-workflow regex tests (bats)
        run: bats .github/workflows/tests/dispatch-pr-preview.bats

      - name: Run local backend launcher tests (bats)
        run: bats scripts/tests/run_backend.bats

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Needs no build, so it runs first and fails in seconds.
      - name: Run format check
        run: cargo fmt --all -- --check

      # Each job keeps its own cache: clippy output cannot serve a real build.
      # Only main saves, so PRs never evict the entries they restore from.
      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lint"
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (mock feature)
        run: cargo clippy -p entity_api -p domain -p web --all-targets --features "domain/mock,web/mock" -- -D warnings

      # docs-collab-server is excluded from workspace default-members, so the
      # --all-targets clippy above skips it; lint it explicitly.
      - name: Run clippy (docs-collab-server)
        run: cargo clippy -p docs-collab-server --all-targets -- -D warnings

  # === TEST JOB ===
  test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Set OpenSSL Paths
        run: |
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --all-targets

      # Also runs the mock-gated suites, via the all_tests runner in src/main.rs.
      - name: Run tests
        run: cargo test

      # Excluded from default-members, so `cargo test` above skips it. Runs the
      # unit + frozen protocol-conformance suites; DB-backed tests are ignored
      # without a live Postgres.
      - name: Run docs-collab-server tests
        run: cargo test -p docs-collab-server

  # === DOCKER BUILD & PUSH JOB ===
  # One leg per image, in parallel with each other and with lint and test.
  # Each pushes only the :<sha> tag; the promote job moves :latest once
  # everything passes, so :latest (what production deploys) only ever points
  # at tested code.
  docker:
    name: Build & Push Docker Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            file: ./Dockerfile
            suffix: ""
            title: Refactor Platform Backend
            description: Rust backend for refactor coaching platform
          - image: docs-collab
            file: ./docs-collab-server/Dockerfile
            suffix: /docs-collab
            title: Refactor Platform docs-collab-server
            description: Self-hosted collaborative document server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The layer cache lives in GHCR, which never evicts it (the Actions
      # cache is capped at 10 GB and churns). Only pushes to main write it;
      # PRs read it.
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ env.BRANCH_IMAGE }}${{ matrix.suffix }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BUILD_CACHE }}:${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:{1},mode=max,image-manifest=true,oci-mediatypes=true', env.BUILD_CACHE, matrix.image) || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # === PROMOTE JOB ===
  # Points :latest at the images built above, only after lint and test pass.
  promote:
    name: Tag Images as Latest
    runs-on: ubuntu-24.04
    needs: [lint, test, docker]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Images as latest
        id: tag
        run: |
          for image in "$BRANCH_IMAGE" "$BRANCH_IMAGE/docs-collab"; do
            docker buildx imagetools create -t "$image:latest" "$image:$GITHUB_SHA"
          done
          digest=$(docker buildx imagetools inspect "$BRANCH_IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "backend_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest Backend Build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.BRANCH_IMAGE }}
          subject-digest: ${{ steps.tag.outputs.backend_digest }}
          push-to-registry: true

      - name: Print Usage Instructions
        run: |
          echo "🎉 CI completed successfully!"
          echo ""
          echo "📦 Backend Image:"
          echo "  docker pull $BRANCH_IMAGE:latest"
          echo "  docker pull $BRANCH_IMAGE:$GITHUB_SHA"
          echo ""
          echo "📦 docs-collab Image:"
          echo "  docker pull $BRANCH_IMAGE/docs-collab:latest"
          echo ""
          echo "🚀 Run Backend:"
          echo "  docker run --rm --env-file .env -p ${{ vars.BACKEND_PORT || '4000' }}:${{ vars.BACKEND_PORT || '4000' }} $BRANCH_IMAGE:latest"

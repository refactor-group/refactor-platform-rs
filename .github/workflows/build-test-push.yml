name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit lands.
# Main is exempt: a deploy mid-merge shouldn't be killed by the next PR merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sccache + incremental compilation are mutually exclusive — sccache caches
  # whole-crate codegen units, while incremental layers per-edit deltas on top
  # of an already-built crate. Disable incremental so sccache can do its job.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Wire sccache as the rustc wrapper in every job that compiles Rust.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # === LINT JOB (Fast Feedback) ===
  # BATS suite for the dispatch resolver runs as the first step of lint so
  # a regex regression fails before clippy/test/docker eat their full
  # runtime. Keeps the Actions sidebar uncluttered (no separate "bats" job).
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run dispatch-workflow regex tests (bats)
        run: bats .github/workflows/tests/dispatch-pr-preview.bats

      - name: Run local backend launcher tests (bats)
        run: bats scripts/tests/run_backend.bats

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Needs no build, so it runs first and fails in seconds.
      - name: Run format check
        run: cargo fmt --all -- --check

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main"
          key: "lint"
          cache-all-crates: true

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (mock feature)
        run: cargo clippy -p entity_api -p domain -p web --all-targets --features "domain/mock,web/mock" -- -D warnings

      # docs-collab-server is excluded from workspace default-members, so the
      # --all-targets clippy above skips it; lint it explicitly.
      - name: Run clippy (docs-collab-server)
        run: cargo clippy -p docs-collab-server --all-targets -- -D warnings

      - name: Show sccache stats
        run: sccache --show-stats

  # === TEST JOB ===
  test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Set OpenSSL Paths
        run: |
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu" >> $GITHUB_ENV

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Use cached dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "main"
          key: "test"
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Build
        run: cargo build --all-targets

      # Also runs the mock-gated suites, via the all_tests runner in src/main.rs.
      - name: Run tests
        run: cargo test

      # Excluded from default-members, so `cargo test` above skips it. Runs the
      # unit + frozen protocol-conformance suites; DB-backed tests are ignored
      # without a live Postgres.
      - name: Run docs-collab-server tests
        run: cargo test -p docs-collab-server

      - name: Show sccache stats
        run: sccache --show-stats

  # === DOCKER BUILD & PUSH JOB ===
  # Runs in parallel with lint and test and pushes only the :<sha> tag. The
  # promote job moves :latest once everything passes, so :latest (what
  # production deploys) only ever points at tested code.
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image_name: ${{ steps.tags.outputs.backend_image_name }}
      backend_digest: ${{ steps.push_backend.outputs.digest }}
      docs_collab_image_name: ${{ steps.tags.outputs.docs_collab_image_name }}
      docs_collab_digest: ${{ steps.push_docs_collab.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Names
        id: tags
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository }}/${BRANCH_NAME}"
          echo "backend_image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "docs_collab_image_name=${IMAGE_NAME}/docs-collab" >> $GITHUB_OUTPUT

      # Only pushes to main write the layer cache (exporting it costs ~2 min);
      # PRs still read it.
      - name: Build and Push Backend Image
        id: push_backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ steps.tags.outputs.backend_image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
          labels: |
            org.opencontainers.image.title=Refactor Platform Backend
            org.opencontainers.image.description=Rust backend for refactor coaching platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and Push docs-collab Image
        id: push_docs_collab
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docs-collab-server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          tags: ${{ steps.tags.outputs.docs_collab_image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=docs-collab
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=docs-collab,mode=max' || '' }}
          labels: |
            org.opencontainers.image.title=Refactor Platform docs-collab-server
            org.opencontainers.image.description=Self-hosted collaborative document server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # === PROMOTE JOB ===
  # Points :latest at the images built above, only after lint and test pass.
  promote:
    name: Tag Images as Latest
    runs-on: ubuntu-24.04
    needs: [lint, test, docker]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      BACKEND_IMAGE: ${{ needs.docker.outputs.backend_image_name }}
      BACKEND_DIGEST: ${{ needs.docker.outputs.backend_digest }}
      DOCS_COLLAB_IMAGE: ${{ needs.docker.outputs.docs_collab_image_name }}
      DOCS_COLLAB_DIGEST: ${{ needs.docker.outputs.docs_collab_digest }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Images as latest
        run: |
          docker buildx imagetools create -t "$BACKEND_IMAGE:latest" "$BACKEND_IMAGE@$BACKEND_DIGEST"
          docker buildx imagetools create -t "$DOCS_COLLAB_IMAGE:latest" "$DOCS_COLLAB_IMAGE@$DOCS_COLLAB_DIGEST"

      - name: Attest Backend Build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ env.BACKEND_DIGEST }}
          push-to-registry: true

      - name: Print Usage Instructions
        run: |
          echo "🎉 CI completed successfully!"
          echo ""
          echo "📦 Backend Image:"
          echo "  docker pull $BACKEND_IMAGE:latest"
          echo "  docker pull $BACKEND_IMAGE:${{ github.sha }}"
          echo ""
          echo "📦 docs-collab Image:"
          echo "  docker pull $DOCS_COLLAB_IMAGE:latest"
          echo ""
          echo "🚀 Run Backend:"
          echo "  docker run --rm --env-file .env -p ${{ vars.BACKEND_PORT || '4000' }}:${{ vars.BACKEND_PORT || '4000' }} $BACKEND_IMAGE:latest"

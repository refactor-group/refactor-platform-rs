[package]
name = "entity_api"
version = "1.0.0-beta4"
edition = "2021"

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
entity = { path = "../entity" }
service = { path = "../service" }
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }

log = "0.4.22"
axum-login = "0.16.0"
async-trait = "0.1.83"
base64 = "0.22"
password-auth = "1.0.0"
slugify = "0.1.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono", "config"] }

[dependencies.sea-orm]
version = "2.0.3"                                                       # sea-orm version
features = ["debug-print", "runtime-tokio-native-tls", "sqlx-postgres"]

[dev-dependencies]
tokio = { version = "1.44", features = ["full"] }

[features]
mock = ["sea-orm/mock"]

[build-dependencies]
utoipa-config = "0.1"

# Main nginx configuration for containerized deployment
user nginx;
worker_processes auto;
# Raise the per-worker soft FD limit so long-lived WS connections (2 FDs each,
# client + upstream) don't exhaust the 1024 default.
worker_rlimit_nofile 16384;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Cloudflare proxies every request, so $remote_addr would be a Cloudflare
    # address. Take the client's from CF-Connecting-IP, which Cloudflare alone
    # sets, and only on connections from its ranges (cloudflare.com/ips).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Rate limiting (edge backstop for auth/credential-recovery endpoints)
    #
    # Coarse per-IP flood limiter applied at the proxy, in front of ALL
    # backend instances. This is the OUTERMOST of three layers; it is
    # deliberately looser than the in-process app limit so it only sheds
    # gross abuse before it reaches the Rust process, while the precise
    # per-route and per-email policies live in the backend:
    #   1. (here) nginx limit_req  — per-IP, fleet-wide, ~30 req/min
    #   2. PerIpThrottle (governor) — per-IP, per-process, ~10 req/min
    #   3. password_reset_attempts  — per-email-hash (min-interval + daily cap)
    # See docs/architecture/throttling.md and password_reset.md.
    #
    # $binary_remote_addr is the real client because of the real_ip block
    # above.
    #
    # 10m zone holds ~160k distinct IPs. Named generically so future auth
    # endpoints (login, signup) can reuse it.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    # The backend and docs-collab readiness checks each cost a database round
    # trip. docs-collab has no in-process throttle, and the backend's keys on
    # X-Forwarded-For, so this is the limit a client cannot get around.
    limit_req_zone $binary_remote_addr zone=health_limit:1m rate=60r/m;
    limit_req_status 429;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Buffer settings for better performance
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # SSL configuration defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Include site-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
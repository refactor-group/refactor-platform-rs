[package]
name = "entity"
version = "1.0.0-beta4"
edition = "2021"

[lib]
name = "entity"
path = "src/lib.rs"

[dependencies]
axum-login = "0.16.0"
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono", "config"] }

uuid = { version = "1.11.0", features = ["v4", "serde"] }

[dependencies.sea-orm]
version = "2.0.3"
features = ["with-uuid", "with-json", "with-rust_decimal"]

[build-dependencies]
utoipa-config = "0.1"
